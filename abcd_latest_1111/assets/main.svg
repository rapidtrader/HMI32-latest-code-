<svg width="600" height="750" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">

  <!-- ===== REALISTIC TRUCK BODY (TOP VIEW) ===== -->

 <!-- ===== MAIN CHASSIS (REAR BODY) ===== -->
  <rect x="60" y="120" width="180" height="320" rx="10"
        fill="#2b2b2b" stroke="#555" stroke-width="2"/>

  <!-- Cross members (frame look) -->
  <g stroke="#444" stroke-width="3">
    <line x1="60" y1="160" x2="240" y2="160"/>
    <line x1="60" y1="220" x2="240" y2="220"/>    
    <line x1="60" y1="400" x2="240" y2="400"/>
  </g>

 <!-- ===== SUCTION HEAD ===== -->
<g>

  <!-- Body -->
  <rect x="82" y="350" width="140" height="40" rx="8"
        fill="#3a3a3a" stroke="#0af3f7"/>

  <!-- ===== SUCTION HOSE (CENTER TOP EDGE) ===== -->
  <!-- Outer ring -->
  <circle cx="153" cy="350" r="14"
          fill="#222" stroke="#0af3f7" stroke-width="3"/>

  <!-- Inner hole -->
  <circle cx="153" cy="350" r="7"
          fill="#000"/>

  <!-- Glow effect -->
  <circle cx="153" cy="350" r="10"
          fill="none" stroke="#0af3f7" stroke-width="2" opacity="0.5">
    <animate attributeName="r" from="8" to="14" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== PARTICLE AIRFLOW ===== -->
  <g fill="#0af3f7" opacity="0.9">

    <!-- LEFT SIDE -->
    <circle cx="110" cy="430" r="2">
      <animate attributeName="cx" from="110" to="153" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" from="430" to="350" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="120" cy="440" r="2.5">
      <animate attributeName="cx" from="120" to="153" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="cy" from="440" to="350" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="1s" repeatCount="indefinite"/>
    </circle>

    <!-- RIGHT SIDE -->
    <circle cx="190" cy="435" r="2">
      <animate attributeName="cx" from="190" to="153" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" from="435" to="350" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="1.1s" repeatCount="indefinite"/>
    </circle>

    <circle cx="180" cy="445" r="2.2">
      <animate attributeName="cx" from="180" to="153" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" from="445" to="350" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="1.3s" repeatCount="indefinite"/>
    </circle>

    <!-- CENTER STRONG SUCTION -->
    <circle cx="153" cy="430" r="3">
      <animate attributeName="cy" from="430" to="350" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="0.9s" repeatCount="indefinite"/>
    </circle>

  </g>

</g>

  <!-- ===== FRONT CABIN (TAPERED) ===== -->
  <g>

    <!-- Cabin base -->
    <rect x="80" y="60" width="140" height="80" rx="20"
          fill="#1f1f1f" stroke="#555" stroke-width="2"/>

    <!-- Curved front nose -->
    <path d="
      M80,60
      Q150,20 220,60
      L220,90
      Q150,40 80,90
      Z"
      fill="#1a1a1a" stroke="#555" stroke-width="2"/>

    <!-- Windshield -->
    <path d="
      M95,70
      Q150,50 205,70
      L200,95
      Q150,80 100,95
      Z"
      fill="#0a1f2f" stroke="#0af3f7" stroke-width="1.5"/>

    <!-- LEFT HEADLIGHT (tilted outward) -->
<ellipse cx="105" cy="55" rx="8" ry="5"
         fill="#ffd700"
         transform="rotate(-20 105 55)"/>

<!-- RIGHT HEADLIGHT (tilted outward opposite side) -->
<ellipse cx="195" cy="55" rx="8" ry="5"
         fill="#ffd700"
         transform="rotate(20 195 55)"/>

    <!-- Grill -->
    <g stroke="#444" stroke-width="2">
      <line x1="120" y1="90" x2="120" y2="142"/>
      <line x1="140" y1="90" x2="140" y2="142"/>
      <line x1="160" y1="90" x2="160" y2="142"/>
      <line x1="180" y1="90" x2="180" y2="142"/>
    </g>

  </g>

  <!-- ===== Wheels ===== -->
  <rect x="60" y="70" width="20" height="50" rx="3" fill="#4f4f4f"/>
  <rect x="220" y="70" width="20" height="50" rx="3" fill="#4f4f4f"/>

  

<!-- ===== SIDE DETAILS ===== -->

<!-- Left side strip -->
<rect x="80" y="60" width="8" height="140" fill="#444"/>

<!-- Right side strip -->
<rect x="212" y="60" width="8" height="140" fill="#444"/>

  <!-- ===== BRUSH DEFINITION ===== -->
  <defs>

    <line id="bristle" x1="0" y1="-25" x2="0" y2="-45"/>

    <g id="brush">
      <circle r="25" fill="#444"/>
      <circle r="25" fill="none" stroke="#0af3f7" stroke-width="3"/>

      <g stroke="#0af3f7" stroke-width="2" stroke-linecap="round">
        <!-- 40 bristles -->
        <use href="#bristle" transform="rotate(0)"/>
        <use href="#bristle" transform="rotate(9)"/>
        <use href="#bristle" transform="rotate(18)"/>
        <use href="#bristle" transform="rotate(27)"/>
        <use href="#bristle" transform="rotate(36)"/>
        <use href="#bristle" transform="rotate(45)"/>
        <use href="#bristle" transform="rotate(54)"/>
        <use href="#bristle" transform="rotate(63)"/>
        <use href="#bristle" transform="rotate(72)"/>
        <use href="#bristle" transform="rotate(81)"/>
        <use href="#bristle" transform="rotate(90)"/>
        <use href="#bristle" transform="rotate(99)"/>
        <use href="#bristle" transform="rotate(108)"/>
        <use href="#bristle" transform="rotate(117)"/>
        <use href="#bristle" transform="rotate(126)"/>
        <use href="#bristle" transform="rotate(135)"/>
        <use href="#bristle" transform="rotate(144)"/>
        <use href="#bristle" transform="rotate(153)"/>
        <use href="#bristle" transform="rotate(162)"/>
        <use href="#bristle" transform="rotate(171)"/>
        <use href="#bristle" transform="rotate(180)"/>
        <use href="#bristle" transform="rotate(189)"/>
        <use href="#bristle" transform="rotate(198)"/>
        <use href="#bristle" transform="rotate(207)"/>
        <use href="#bristle" transform="rotate(216)"/>
        <use href="#bristle" transform="rotate(225)"/>
        <use href="#bristle" transform="rotate(234)"/>
        <use href="#bristle" transform="rotate(243)"/>
        <use href="#bristle" transform="rotate(252)"/>
        <use href="#bristle" transform="rotate(261)"/>
        <use href="#bristle" transform="rotate(270)"/>
        <use href="#bristle" transform="rotate(279)"/>
        <use href="#bristle" transform="rotate(288)"/>
        <use href="#bristle" transform="rotate(297)"/>
        <use href="#bristle" transform="rotate(306)"/>
        <use href="#bristle" transform="rotate(315)"/>
        <use href="#bristle" transform="rotate(324)"/>
        <use href="#bristle" transform="rotate(333)"/>
        <use href="#bristle" transform="rotate(342)"/>
        <use href="#bristle" transform="rotate(351)"/>
      </g>

      <circle r="10" fill="#999"/>
    </g>

  </defs>

  <!-- ===== LEFT FRONT (ANTI-CLOCKWISE) ===== -->
  <g transform="translate(70,200)">
    <g>
      <use href="#brush"/>
      <animateTransform attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="3s"
        repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ===== LEFT REAR ===== -->
  <g transform="translate(70,300)">
    <g>
      <use href="#brush"/>
      <animateTransform attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="3s"
        repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ===== RIGHT FRONT (CLOCKWISE) ===== -->
  <g transform="translate(230,200)">
    <g>
      <use href="#brush"/>
      <animateTransform attributeName="transform"
        type="rotate"
        from="0"
        to="-360"
        dur="3s"
        repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ===== RIGHT REAR ===== -->
  <g transform="translate(230,300)">
    <g>
      <use href="#brush"/>
      <animateTransform attributeName="transform"
        type="rotate"
        from="0"
        to="-360"
        dur="3s"
        repeatCount="indefinite"/>
    </g>
  </g>

<!-- ===== REAR WARNING LIGHTS (RECTANGULAR - YELLOW BLINK) ===== -->
<g>

  <!-- LEFT LIGHT -->
  <g>
    <!-- Light body -->
    <rect x="80" y="425" width="20" height="10" rx="2" fill="#ffaa00"/>

    <!-- Glow -->
    <rect x="80" y="425" width="20" height="10" rx="2"
          fill="#ffaa00" opacity="0.8">
      <animate attributeName="opacity"
        values="1;0;1"
        dur="1s"
        repeatCount="indefinite"/>
    </rect>

    <!-- Outer glow -->
    <rect x="75" y="420" width="30" height="20" rx="4"
          fill="#ffaa00" opacity="0.3">
      <animate attributeName="opacity"
        values="0.6;0;0.6"
        dur="1s"
        repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- RIGHT LIGHT -->
  <g>
    <!-- Light body -->
    <rect x="200" y="425" width="20" height="10" rx="2" fill="#ffaa00"/>

    <!-- Glow -->
    <rect x="200" y="425" width="20" height="10" rx="2"
          fill="#ffaa00" opacity="0.8">
      <animate attributeName="opacity"
        values="1;0;1"
        dur="1s"
        repeatCount="indefinite"/>
    </rect>

    <!-- Outer glow -->
    <rect x="195" y="420" width="30" height="20" rx="4"
          fill="#ffaa00" opacity="0.3">
      <animate attributeName="opacity"
        values="0.6;0;0.6"
        dur="1s"
        repeatCount="indefinite"/>
    </rect>
  </g>

</g>

</svg>